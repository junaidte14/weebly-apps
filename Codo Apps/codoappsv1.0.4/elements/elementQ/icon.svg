<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">

  <!-- Button circle -->
  <circle cx="48" cy="52" r="30" fill="#ffffff" opacity="0.95"/>

  <!-- Progress ring arc (partial, ~70%) -->
  <circle cx="48" cy="52" r="42"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="263.9"
    stroke-dashoffset="79.2"
    transform="rotate(-90 48 52)"
    opacity="0.4"/>

  <!-- Ring track (faint) -->
  <circle cx="48" cy="52" r="42"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    opacity="0.15"/>

  <!-- Up arrow icon inside button -->
  <polygon points="48,30 35,47 43,47 43,62 53,62 53,47 61,47" fill="#4A90D9"/>

</svg>
